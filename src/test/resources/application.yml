# Test defaults — applied to all test contexts.
# - Unit tests that don't need a database annotate with @SpringBootTest and
#   explicitly pass the exclude properties (see SecureApiApplicationTests).
# - Integration tests supply the Testcontainers datasource URL via
#   @DynamicPropertySource so Spring wires the full context including JPA/Flyway.
logging:
  level:
    root: WARN
    com.ouokki: DEBUG
    org.flywaydb: INFO
