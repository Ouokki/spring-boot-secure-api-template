spring:
  application:
    name: secure-api
  profiles:
    active: local
  jpa:
    properties:
      hibernate:
        default_schema: app

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      # Attached to every meter — essential for Grafana dashboard filtering.
      application: ${spring.application.name}

app:
  jwt:
    # Dev keys generated by scripts/generate-dev-keys.sh — never commit real keys.
    private-key-path: ${JWT_PRIVATE_KEY_PATH:dev-keys/private.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:dev-keys/public.pem}
    # 15 minutes — short TTL limits the blast radius of a stolen token.
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
  security:
    # Lock account after this many consecutive failures; reset on success.
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    # Minutes the account stays locked before the next attempt is allowed.
    lockout-duration-minutes: ${LOCKOUT_DURATION_MINUTES:15}
  rate-limit:
    # Maximum requests allowed per unique client IP within a 1-minute window.
    requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:60}
    # Tokens available immediately at startup (burst allowance, must be ≤ requests-per-minute).
    burst-capacity: ${RATE_LIMIT_BURST_CAPACITY:10}

---
# ─── local profile ────────────────────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/secureapi
    username: secureapi
    # Must match POSTGRES_PASSWORD in compose.yaml. Use .env for the real value.
    password: CHANGE_ME_BEFORE_RUNNING
    hikari:
      # Pool sizing formula: cpu_count * 2 + effective_spindle_count.
      # Laptop with 4 cores and SSD: 4*2+1=9. Keeping it lower for dev to avoid
      # exhausting the shared compose Postgres connection limit.
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # Pool name appears in logs and JMX — critical for diagnosing pool exhaustion.
      pool-name: SecureApi-local
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    default-schema: app

server:
  port: 8080

---
# ─── test profile ─────────────────────────────────────────────────────────────
# Datasource URL and credentials are injected at runtime by Testcontainers via
# @DynamicPropertySource. This block documents the expected properties so
# Spring's relaxed binding can find them even if Testcontainers hasn't run yet.
spring:
  config:
    activate:
      on-profile: test
  datasource:
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
      pool-name: SecureApi-test
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    default-schema: app

---
# ─── prod profile ─────────────────────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      # Pool sizing formula: cpu_count * 2 + effective_spindle_count.
      # For a typical 2-vCPU cloud instance with SSD (spindle_count=1): 2*2+1=5.
      # Over-sizing the pool hurts: each idle connection consumes ~8 MB on Postgres
      # and adds latency on context switches. Tune per actual hardware; the default
      # is intentionally conservative to fail fast rather than silently degrade.
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # heartbeat to detect stale connections through NAT/firewall idle timeouts
      keepalive-time: 60000
      pool-name: SecureApi-prod
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    # baseline-on-migrate is safe only when the schema already exists and was
    # created outside Flyway. Enable via env var, never hard-code to true.
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    default-schema: app

server:
  port: ${PORT:8080}
